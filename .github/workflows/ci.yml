name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Deno (3 jobs)
  # ──────────────────────────────────────────────────────────────────────────
  deno-test:
    name: Deno ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9
      - name: Check
        if: matrix.os == 'ubuntu-latest'
        run: deno check src/
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: deno lint src/
      - name: Test (unit)
        run: deno test -A tests/theme.test.ts

  # ──────────────────────────────────────────────────────────────────────────
  # Bun (3 jobs)
  # ──────────────────────────────────────────────────────────────────────────
  bun-test:
    name: Bun ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install dependencies
        run: bun install
      - name: Test (unit)
        run: bun test tests/theme.test.ts

  # ──────────────────────────────────────────────────────────────────────────
  # Node.js (3 jobs)
  # ──────────────────────────────────────────────────────────────────────────
  node-test:
    name: Node ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test (unit)
        run: npm run test:node
